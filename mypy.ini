# Static type-checking configuration for facebook-extractor.
# Run: .venv\Scripts\python.exe -m mypy .
[mypy]
python_version = 3.11
ignore_missing_imports = True
check_untyped_defs = True
disallow_untyped_defs = True
warn_unused_ignores = True
# The audit suite intentionally uses duck-typed fakes (FlakySession,
# FakeResponse) to exercise retry logic offline; typing it strictly would add
# noise without value.
exclude = (?i)(tests|\.venv)[\\/]
