# Pre-commit hooks for facebook-extractor.
#
# Install once (inside the project venv):
#     pip install pre-commit
#     pre-commit install
# Run against everything:
#     pre-commit run --all-files
#
# Hook revisions are pinned to the tool versions this project is verified
# against (ruff 0.17.0, mypy 2.4.0); both tags were checked against the
# upstream repositories' tag listings.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--force-exclude]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: [--config-file=mypy.ini]

  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests (offline, 90 checks)
        entry: python tests/unit_tests.py
        language: system
        pass_filenames: false
        always_run: true
      - id: audit-suite
        name: audit suite (offline, 54 checks)
        entry: python tests/audit_suite.py
        language: system
        pass_filenames: false
        always_run: true
      - id: dashboard-tests
        name: dashboard tests (offline, 55 checks)
        entry: python tests/dashboard_tests.py
        language: system
        pass_filenames: false
        always_run: true
