name: Feature request
description: Suggest an improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This does not involve bypassing login walls, CAPTCHAs, or accessing private content
          required: true
        - label: This does not require publishing scraped data with the repository
          required: true
