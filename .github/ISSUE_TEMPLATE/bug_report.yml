name: Bug report
description: Something broke or extracted incorrectly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do not include private content or credentials.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - URL classification
        - Video/reel metadata (yt-dlp)
        - Post metadata / link preview
        - Subtitle or transcript parsing
        - Audio transcription (Whisper)
        - AI summarization
        - Exports
        - Dashboard
        - CLI / configuration
        - Other
    validations:
      required: true
  - type: input
    id: url-shape
    attributes:
      label: URL shape
      description: The URL pattern with the ID redacted, e.g. https://www.facebook.com/share/r/<id>/
      placeholder: https://www.facebook.com/share/r/…
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: python main.py ingest --url "…" --transcribe
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected vs. what happened
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message / stored error_message
      description: From the CLI output, `python main.py status`, or the item's `error_message` field.
      render: text
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `python --version`, `pip show yt-dlp | findstr Version`, and your OS.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I updated yt-dlp first (`pip install -U yt-dlp`)
          required: false
        - label: This is only about publicly accessible content (no login-wall requests)
          required: true
